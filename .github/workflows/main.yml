name: main

on: push

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  app: documentation

jobs:
  build-and-push:
    runs-on: self-hosted-common
    if: contains(fromJSON('["refs/heads/develop", "refs/heads/release", "refs/heads/master", "refs/heads/main"]'), github.ref)
    steps:
      - uses: actions/checkout@v7
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/Dockerfile
          push: true
          pull: true
          tags: |
            docker-registry.bimdata.io/bimdata/${{ env.app }}:${{ github.sha }}
            docker-registry.bimdata.io/bimdata/${{ env.app }}:${{ env.tag }}
          # Runners are ephemeral: layer cache per environment in our registry, falling back on staging
          cache-from: |
            type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-${{ env.tag }}
            type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-staging
          cache-to: type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-${{ env.tag }},mode=max,image-manifest=true
  deploy:
    runs-on: self-hosted-deploy
    needs: build-and-push
    steps:
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Deploy on ${{ env.tag }}
        uses: bimdata/actions/deployment@v6
        with:
          inventory: ${{ env.tag }}
          app: ${{ env.app }}
          vault-pass: ${{ secrets.ANSIBLE_VAULT_PASSWD }}
